# Project-wide Manim defaults. Per-render overrides come from tools/preview.sh.
# Rationale lives in SERIES_PLAN.md ("Iteration-speed workflow"): draft fast,
# render high quality only for finals.
[CLI]
# Predictable output location so tools/preview.sh can find the newest render.
media_dir = ./media
# Draft quality by default (-ql equivalent). preview.sh sets -qh for finals.
quality = low_quality
# We drive the viewer (mpv) ourselves; don't let manim spawn its own.
preview = False
# A calm dark background that reads well next to sim footage.
background_color = #0e1116
